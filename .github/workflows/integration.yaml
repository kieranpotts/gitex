#
# Run static and dynamic tests on both merge request and
# new commits pushed to the trunk.
#

name: Integration

on:
  push:
    branches:
      - latest/dev
  pull_request:
    branches:
      - latest/dev

jobs:
  lint:
    name: Run static analysis checks
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, for security.
      # https://github.com/actions/checkout
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Install the toolchain pinned in `mise.toml`, so that CI runs the same
      # tool versions as the host and the devcontainer.
      # https://github.com/jdx/mise-action
      - name: Install toolchain
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
      # The same install script as on the host and in the devcontainer. It
      # installs Ruff at the version locked in `poetry.lock`.
      - name: Install dependencies
        run: ./run/install
      # The same checks as `./run/check`.
      - name: Lint shell scripts with ShellCheck
        run: mise exec -- shellcheck --severity=style bin/* lib/*
      - name: Lint Python with Ruff
        run: mise exec -- poetry run ruff check test/

  test:
    name: Run dynamic tests
    runs-on: ubuntu-latest
    steps:
      # See the `lint` job.
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
      - name: Install dependencies
        run: ./run/install
      - name: Run unit tests
        run: mise exec -- poetry run pytest
