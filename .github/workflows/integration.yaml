#
# Run static and dynamic tests on both merge request and
# new commits pushed to the trunk.
#

name: Integration

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  lint:
    name: Run static analysis checks
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository and fetch its full log history.
      # https://github.com/actions/checkout?tab=readme-ov-file#fetch-all-history-for-all-tags-and-branches
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Install the toolchain pinned in `mise.toml`, so that CI runs the same
      # tool versions as the host and the devcontainer. The action is pinned to
      # a commit SHA, for security. https://github.com/jdx/mise-action
      - name: Install toolchain
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
      - name: Shellcheck
        run: shellcheck --severity=style bin/* lib/*
      # https://github.com/astral-sh/ruff-action
      - name: Lint Python with Ruff
        uses: astral-sh/ruff-action@v3
        with:
          src: "./run/test"
          # version: "latest" # Defined in pyproject.toml

  test:
    name: Run dynamic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # See the `lint` job.
      - name: Install toolchain
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
      # The same install script as on the host and in the devcontainer.
      - name: Install dependencies
        run: ./run/install
      - name: Run unit tests
        run: mise exec -- poetry run pytest
